services:
  - type: web
    name: food-calorie-intake
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: USDA_FDC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: food-calorie-intake-db
          property: connectionString

databases:
  - name: food-calorie-intake-db
    plan: free
