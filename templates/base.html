<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Calorie Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #050816;
        --gradient-top: #1f2937;
        --card-grad-a: #1f2937;
        --card-grad-b: #020617;
        --accent: #38bdf8;
        --accent-soft: rgba(56, 189, 248, 0.15);
        --text: #e5e7eb;
        --muted: #9ca3af;
        --danger: #f97373;
        --input-bg: rgba(15, 23, 42, 0.9);
        --entry-border: rgba(30, 64, 175, 0.4);
        --border: rgba(148, 163, 184, 0.3);
      }

      [data-theme="light"] {
        --bg: #f0f4f8;
        --gradient-top: #e2e8f0;
        --card-grad-a: #f8fafc;
        --card-grad-b: #eef2f7;
        --accent: #0284c7;
        --accent-soft: rgba(2, 132, 199, 0.1);
        --text: #1e293b;
        --muted: #64748b;
        --danger: #dc2626;
        --input-bg: rgba(241, 245, 249, 0.95);
        --entry-border: rgba(100, 116, 139, 0.2);
        --border: rgba(100, 116, 139, 0.25);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
          sans-serif;
        background: radial-gradient(circle at top, var(--gradient-top) 0, var(--bg) 55%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: stretch;
        justify-content: center;
      }

      .shell {
        width: 100%;
        max-width: 960px;
        padding: 32px 16px 40px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      .app-title {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .pill {
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
      }

      nav {
        display: flex;
        gap: 6px;
        font-size: 0.85rem;
        flex-wrap: wrap;
      }

      nav a {
        color: var(--muted);
        text-decoration: none;
        padding: 4px 9px;
        border-radius: 999px;
        border: 1px solid transparent;
        transition: background 0.15s ease, color 0.15s ease,
          border-color 0.15s ease;
      }

      nav a:hover {
        background: rgba(15, 23, 42, 0.9);
        border-color: rgba(148, 163, 184, 0.6);
        color: var(--text);
      }

      nav a.active {
        background: var(--accent-soft);
        border-color: rgba(56, 189, 248, 0.7);
        color: #e0f2fe;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 2.1fr) minmax(0, 1.4fr);
        gap: 18px;
      }

      @media (max-width: 800px) {
        main {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      .card {
        background: radial-gradient(circle at top left, var(--card-grad-a) 0, var(--card-grad-b) 55%);
        border-radius: 18px;
        padding: 18px 18px 16px;
        border: 1px solid var(--border);
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.15);
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 12px;
        gap: 8px;
      }

      .card-title {
        font-size: 0.95rem;
        font-weight: 600;
      }

      .subtle {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .list {
        margin: 0;
        padding: 0;
        list-style: none;
        max-height: 360px;
        overflow-y: auto;
        scrollbar-width: thin;
      }

      .list-empty {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .entry {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 6px 0;
        border-bottom: 1px solid var(--entry-border);
      }

      .entry:last-child {
        border-bottom: none;
      }

      .entry-main {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .entry-meta {
        display: flex;
        gap: 8px;
        font-size: 0.75rem;
        color: var(--muted);
      }

      .entry-notes {
        font-size: 0.8rem;
        color: #e5e7eb;
      }

      .entry-cal {
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--accent);
        white-space: nowrap;
      }

      .total-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(148, 163, 184, 0.4);
        font-size: 0.95rem;
      }

      .tag {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 0.8rem;
        color: var(--muted);
      }

      input,
      textarea {
        width: 100%;
        padding: 7px 9px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--input-bg);
        color: var(--text);
        font: inherit;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.6);
      }

      textarea {
        min-height: 58px;
        resize: vertical;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 4px;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 7px 14px;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        background: linear-gradient(135deg, #38bdf8, #4f46e5);
        color: #e0f2fe;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.9);
        transition: transform 0.08s ease, box-shadow 0.08s ease,
          filter 0.08s ease;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.04);
        box-shadow: 0 14px 30px rgba(15, 23, 42, 0.95);
      }

      button:active {
        transform: translateY(0);
        box-shadow: 0 7px 18px rgba(15, 23, 42, 0.9);
      }

      .history-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.85rem;
      }

      .history-item {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 7px 9px;
        border-radius: 10px;
        background: var(--input-bg);
        border: 1px solid var(--border);
      }

      .history-item a {
        color: inherit;
        text-decoration: none;
      }

      .history-item a:hover {
        text-decoration: underline;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body data-csrf-token="{{ csrf_token() }}">
    <div class="shell">
      <header>
        <div class="app-title">
          <span>Calorie Rhythm</span>
          <span class="pill">Daily check-in</span>
        </div>
        <nav>
          <a href="{{ url_for('index') }}" class="{% if active == 'today' %}active{% endif %}"
            >Today</a
          >
          <a href="{{ url_for('history') }}" class="{% if active == 'history' %}active{% endif %}"
            >2‑month history</a
          >
          <a href="{{ url_for('insights') }}" class="{% if active == 'insights' %}active{% endif %}"
            >Insights</a
          >
          <a href="{{ url_for('points') }}" class="{% if active == 'points' %}active{% endif %}"
            >🏆 Points</a
          >
          <a href="{{ url_for('friends_list') }}" class="{% if active == 'friends' %}active{% endif %}"
            >👥 Friends</a
          >
          <a href="{{ url_for('leaderboard') }}" class="{% if active == 'leaderboard' %}active{% endif %}"
            >📊 Leaderboard</a
          >
          <a href="{{ url_for('achievements') }}" class="{% if active == 'achievements' %}active{% endif %}"
            >🎯 Achievements</a
          >
          <a href="{{ url_for('settings_view') }}" class="{% if active == 'settings' %}active{% endif %}"
            >Settings</a
          >
          <a href="{{ url_for('notifications_list') }}" class="{% if active == 'notifications' %}active{% endif %}"
            >🔔 Notifications</a
          >
          {% if current_user.is_authenticated %}
          <span style="font-size:0.8rem;color:var(--muted);padding:4px 6px">{{ current_user.username }}</span>
          <a href="{{ url_for('logout') }}">Log out</a>
          {% endif %}
          <button id="theme-toggle" type="button" onclick="toggleTheme()" style="background:none;border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:999px;font-size:0.8rem;cursor:pointer;box-shadow:none;transform:none;filter:none" title="Toggle light/dark mode">Light</button>
        </nav>
      </header>

      {% block body %}{% endblock %}
    </div>
    <script>
      // Theme toggle
      function applyTheme(theme) {
        document.body.setAttribute("data-theme", theme);
        const btn = document.getElementById("theme-toggle");
        if (btn) btn.textContent = theme === "light" ? "Dark" : "Light";
      }

      function toggleTheme() {
        const current = document.body.getAttribute("data-theme") || "dark";
        const next = current === "light" ? "dark" : "light";
        localStorage.setItem("theme", next);
        applyTheme(next);
      }

      // Apply saved theme immediately
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        applyTheme(saved);
      })();

      document.addEventListener("DOMContentLoaded", function () {
        const token = document.body.getAttribute("data-csrf-token");
        if (!token) {
          return;
        }

        document
          .querySelectorAll('form[method="post"], form[method="POST"]')
          .forEach((form) => {
            if (form.querySelector('input[name="_csrf_token"]')) {
              return;
            }

            const input = document.createElement("input");
            input.type = "hidden";
            input.name = "_csrf_token";
            input.value = token;
            form.appendChild(input);
          });
      });
    </script>
  </body>
  </html>
